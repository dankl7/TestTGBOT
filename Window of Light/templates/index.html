<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window of Light - Управление каналами</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 16px; }
        
        .form-section {
            background: #f8f9fa;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-remove {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 14px;
            margin-left: 10px;
        }
        .btn-remove:hover { background: #c82333; }
        
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        
        .channels-section { margin-top: 40px; }
        .channels-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .channel-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }
        .channel-info { flex: 1; }
        .channel-title { font-weight: 600; color: #333; margin-bottom: 4px; }
        .channel-link { color: #667eea; font-size: 14px; word-break: break-all; }
        .channel-status {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .examples {
            margin-top: 15px;
            padding: 12px;
            background: #e7f3ff;
            border-radius: 6px;
            font-size: 14px;
        }
        .examples code {
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            display: block;
            margin: 4px 0;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Window of Light</h1>
        <p class="subtitle">Управление Telegram каналами для мониторинга</p>
        
        <div class="form-section">
            <h2 style="margin-bottom: 20px; color: #333;">Добавить канал</h2>
            
            <div class="form-group">
                <label for="channelLink">Ссылка на канал:</label>
                <input 
                    type="text" 
                    id="channelLink" 
                    placeholder="https://t.me/durov или https://t.me/+hash"
                >
            </div>
            
            <div class="form-group">
                <label for="channelTitle">Название (опционально):</label>
                <input 
                    type="text" 
                    id="channelTitle" 
                    placeholder="Например: Павел Дуров"
                >
            </div>
            
            <button class="btn" onclick="addChannel()">Добавить канал</button>
            
            <div class="examples">
                <strong>Примеры ссылок:</strong>
                <code>https://t.me/durov</code>
                <code>@durov</code>
                <code>https://t.me/+7uEm3vcRuBRiNWZi (приватный канал)</code>
            </div>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="channels-section">
            <h2>Мониторируемые каналы</h2>
            <button class="btn" onclick="loadChannels()" style="margin-bottom: 15px;">
                🔄 Обновить список
            </button>
            <div id="channelsList"><div class="loading">Загрузка...</div></div>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        
        async function loadChannels() {
            const container = document.getElementById('channelsList');
            container.innerHTML = '<div class="loading">Загрузка...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/channels/`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const channels = await response.json();
                
                if (!Array.isArray(channels) || channels.length === 0) {
                    container.innerHTML = '<p style="color: #999;">Каналов нет. Добавьте первый канал выше.</p>';
                    return;
                }
                
                container.innerHTML = channels.map(ch => `
                    <div class="channel-item">
                        <div class="channel-info">
                            <div class="channel-title">${escapeHtml(ch.title || ch.username || 'Unknown')}</div>
                            <div class="channel-link">${escapeHtml(ch.link || ch.username || '')}</div>
                            <div class="channel-status">
                                ID: ${ch.chat_id || 'N/A'} | 
                                Сообщений: ${ch.last_message_id || 0} |
                                Статус: ${ch.is_active ? '✅ Активен' : '❌ Ошибка'}
                            </div>
                        </div>
                        <button class="btn btn-remove" onclick="removeChannel('${escapeHtml(ch.link || ch.username)}')">
                            Удалить
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<p style="color: #dc3545;">Ошибка загрузки: ${escapeHtml(error.message)}</p>`;
            }
        }
        
        async function addChannel() {
            const linkInput = document.getElementById('channelLink');
            const titleInput = document.getElementById('channelTitle');
            const statusDiv = document.getElementById('status');
            
            const link = linkInput.value.trim();
            const title = titleInput.value.trim();
            
            if (!link) {
                showStatus('error', 'Введите ссылку на канал');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/channels/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link, title: title || null })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    showStatus('success', `✅ Канал ${escapeHtml(link)} успешно добавлен!`);
                    linkInput.value = '';
                    titleInput.value = '';
                    loadChannels();
                } else {
                    showStatus('error', `❌ Ошибка: ${escapeHtml(data.message || 'Не удалось добавить канал')}`);
                }
            } catch (error) {
                showStatus('error', `❌ Ошибка: ${escapeHtml(error.message)}`);
            }
        }
        
        async function removeChannel(link) {
            if (!confirm(`Удалить канал "${escapeHtml(link)}"?`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/channels/remove`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    loadChannels();
                } else {
                    alert(`❌ Ошибка удаления: ${escapeHtml(data.message || 'Не удалось удалить')}`);
                }
            } catch (error) {
                alert(`❌ Ошибка: ${escapeHtml(error.message)}`);
            }
        }
        
        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Загрузка при старте
        loadChannels();
    </script>
</body>
</html>
