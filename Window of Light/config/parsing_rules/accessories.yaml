category:
  id: "accessories"
  name: "Accessories"
  parent_id: null
  keywords:
    - "airpods"
    - "airpods pro"
    - "airpods max"
    - "apple watch"
    - "watch se"
    - "watch ultra"
    - "ipad"
    - "dyson"
    - "stайлер"
    - "фен"
    - "пылесос"
    - "headphones"
    - "наушники"
    - "earbuds"
    - "charger"
    - "заряд"
    - "cable"
    - "кабель"
    - "ps5"
    - "playstation"
    - "dualsense"
    - "controller"
  
  # Флаги
  flags_esim_only: ["🇧🇭", "🇨🇦", "🇬🇺", "🇯🇵", "🇰🇼", "🇲🇽", "🇴🇲", "🇶🇦", "🇸🇦", "🇦🇪", "🇺🇸", "🇻🇮"]
  flags_esim_physical: ["🇪🇺", "🇮🇳", "🇻🇳", "🇦🇺", "🇳🇿", "🇰🇷", "🇸🇬", "🇭🇰"]
  flags_physical_only: ["🇨🇳"]
  
  attributes:
    - name: "type"
      patterns:
        - "\\b(wired|wireless)\\b"
        - "\\b(проводн|беспроводн)\\b"
        - "ANC"
        - "Pro"
        - "Max"
        - "Ultra"
        - "SE"
      type: "string"
    
    - name: "color"
      patterns:
        - "\\b(black|white|blue|red|green|gold|silver|pink|purple|gray|yellow|lavender|sage|teal|ultramarine|starlight|midnight|rose|olive|graphite|natural|desert|citrus|indigo|sky|orange)\\b"
      type: "string"
    
    - name: "size"
      patterns:
        - "(\\d{2})\\s*mm"
        - "(\\d{2})\\s*мм"
        - "40mm|44mm|42mm|46mm"
      type: "string"
    
    - name: "region"
      patterns:
        - "🇧🇭|🇨🇦|🇬🇺|🇯🇵|🇰🇼|🇲🇽|🇴🇲|🇶🇦|🇸🇦|🇦🇪|🇺🇸|🇻🇮|🇪🇺|🇮🇳|🇻🇳|🇦🇺|🇳🇿|🇰🇷|🇸🇬|🇭🇰|🇨🇳|🇷🇺|🇰🇿|🇮🇩|🇹🇭|🇵🇭|🇲🇾|🇵🇦|🇨🇱|🇿🇦|🇬🇧"
      type: "string"
    
    - name: "model"
      patterns:
        - "HS0[1-9]|HD0[1-9]|HD1[1-9]|V[0-9]{2}|Gen[0-9]|S[0-9]{2}|Ultra [1-3]|SE[1-3]|Pro [1-3]|Max [1-3]|Air [1-3]"
      type: "string"

  brand_patterns:
    apple:
      - "airpods"
      - "apple"
      - "watch"
      - "ipad"
    sony:
      - "sony"
      - "wh-1000"
    samsung:
      - "samsung"
      - "galaxy buds"
    jbl:
      - "jbl"
    anker:
      - "anker"
    dyson:
      - "dyson"
      - "supersonic"
      - "airwrap"
      - "v15"
      - "v16"
    sony_playstation:
      - "ps5"
      - "playstation"
      - "dualsense"
  
  price_patterns:
    - "(\\d{1,3}(?:\\s*\\d{3})*|\\d+)\\s*(₽|руб|RUB|\\$|€)"
    - "(\\d+)\\s*(тыс\\.?|k)\\s*(₽|руб)"
